server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /cloudflare {
        add_header cf-ray "fixture-ray" always;
        add_header content-type "text/html; charset=utf-8" always;
        return 403 "<html><title>Attention Required</title><body>Cloudflare challenge</body></html>";
    }

    location = /challenge {
        add_header content-type "text/html; charset=utf-8" always;
        return 200 "<html><title>Example</title><body><div class='g-recaptcha'>Verify you are human</div></body></html>";
    }

    location = /embedded-captcha {
        add_header content-type "text/html; charset=utf-8" always;
        return 200 "<html><title>Support</title><body><main><h1>Contact support</h1><p>Contact our support team for product guidance and account help.</p><div class='g-recaptcha'></div></main></body></html>";
    }

    location = /loading {
        add_header content-type "text/html; charset=utf-8" always;
        return 200 "<html><title>Example</title><body>Loading...</body></html>";
    }

    location = /blank {
        add_header content-type "text/html; charset=utf-8" always;
        return 200 "<html><title></title><body></body></html>";
    }

    location = /below-fold {
        add_header content-type "text/html; charset=utf-8" always;
        return 200 "<html><title>Example</title><body><main><div style='height:1600px'></div><p>Content below the captured viewport.</p></main></body></html>";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
